<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Próximamente — Lira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#1b1a1c; --fg:#78a6f0; color-scheme: dark; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1b1a1c; --fg:#78a6f0; } }
  :root[data-theme="dark"]{ --bg:#1b1a1c; --fg:#78a6f0; }
  *{ box-sizing:border-box; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    margin:0; min-height:100%;
    background:var(--bg); background-color:#1b1a1c; color:var(--fg);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex; flex-direction:column; justify-content:space-between;
    overflow-x:hidden;
  }
  main{
    width:min(1000px,100%); margin:0 auto;
    padding:clamp(20px,5vw,56px);
    flex:1; display:flex; flex-direction:column; justify-content:center;
  }
  h1{
    margin:0; font-family:'Anton','Impact','Arial Narrow',sans-serif; font-weight:400;
    font-size:clamp(72px,26vw,270px); line-height:.9; text-transform:uppercase;
    letter-spacing:.005em;
  }
  p.sub{
    margin:clamp(14px,3vw,28px) 0 0;
    font-family:'Space Mono',ui-monospace,monospace; font-size:clamp(13px,2.6vw,18px);
    letter-spacing:.08em; text-transform:uppercase;
  }
  .contact{ margin-top:clamp(28px,6vw,56px); }
  .contact h2{
    margin:0 0 14px; font-family:'Space Mono',ui-monospace,monospace; font-weight:400;
    font-size:clamp(13px,2.6vw,16px); letter-spacing:.08em; text-transform:uppercase;
  }
  .contact-list{ display:flex; flex-wrap:wrap; gap:12px; }
  .contact-btn{
    display:inline-flex; align-items:center; gap:12px;
    padding:14px 20px; min-height:56px;
    border:3px solid var(--fg); color:var(--fg); text-decoration:none;
    font-family:'Space Mono',ui-monospace,monospace; font-weight:700;
    font-size:clamp(14px,3.4vw,18px); letter-spacing:.06em; text-transform:uppercase;
    transition: background .12s, color .12s;
  }
  .contact-btn svg{ width:28px; height:28px; flex:none; }
  .contact-btn:hover, .contact-btn:focus-visible{ background:var(--fg); color:var(--bg); outline:none; }
  @media (max-width:520px){ .contact-btn{ flex:1 1 100%; } }
</style>
</head>
<body>
  <main>
    <h1>Muy<br>pronto.</h1>
    <p class="sub">Por favor, espera.</p>
    <div class="contact">
      <h2>Mientras tanto, encuéntrame en:</h2>
      <div class="contact-list">
        <a class="contact-btn" href="https://instagram.com/snowfish.cl" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a>
        <a class="contact-btn" href="mailto:snowfishdotnet@gmail.com"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>Gmail</a>
        <a class="contact-btn" href="https://www.linkedin.com/in/isidora-arriv%C3%A9-snowfish" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>LinkedIn</a>
      </div>
    </div>
  </main>
</body>
</html>
