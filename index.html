<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Próximamente — Lira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#1b1a1c; --fg:#78a6f0; color-scheme: dark; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1b1a1c; --fg:#78a6f0; } }
  :root[data-theme="dark"]{ --bg:#1b1a1c; --fg:#78a6f0; }
  *{ box-sizing:border-box; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    margin:0; min-height:100%;
    background:var(--bg); background-color:#1b1a1c; color:var(--fg);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex; flex-direction:column; justify-content:space-between;
    overflow-x:hidden;
  }
  main{
    width:min(1000px,100%); margin:0 auto;
    padding:clamp(20px,5vw,56px);
    flex:1; display:flex; flex-direction:column; justify-content:center;
  }
  h1{
    margin:0; font-family:'Anton','Impact','Arial Narrow',sans-serif; font-weight:400;
    font-size:clamp(72px,26vw,270px); line-height:.9; text-transform:uppercase;
    letter-spacing:.005em;
  }
  p.sub{
    margin:clamp(14px,3vw,28px) 0 0;
    font-family:'Space Mono',ui-monospace,monospace; font-size:clamp(13px,2.6vw,18px);
    letter-spacing:.08em; text-transform:uppercase;
  }
  footer{
    padding:0 clamp(20px,5vw,56px) clamp(20px,4vw,40px);
    width:min(1000px,100%); margin:0 auto;
    font-family:'Space Mono',ui-monospace,monospace; font-size:13px; letter-spacing:.06em;
    display:flex; flex-wrap:wrap; gap:8px 24px; text-transform:uppercase;
  }
  footer a{ color:var(--fg); text-decoration:underline; text-underline-offset:4px; }
  footer a:hover, footer a:focus-visible{ background:var(--fg); color:var(--bg); outline:none; text-decoration:none; }
</style>
</head>
<body>
  <main>
    <h1>Muy<br>pronto.</h1>
    <p class="sub">Por favor, espera.</p>
  </main>
  <footer>
    <a href="https://instagram.com/snowfish.cl" target="_blank" rel="noopener">@snowfish.cl</a>
    <a href="mailto:snowfishdotnet@gmail.com">snowfishdotnet@gmail.com</a>
  </footer>
</body>
</html>
